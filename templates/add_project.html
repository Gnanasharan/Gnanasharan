{% extends "base.html" %}

{% block title %}Add Project - Freelancer Hiring Platform{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2>Post a New Project</h2>
        <form method="POST" class="form">
            <div class="form-group">
                <label for="title">Project Title:</label>
                <input type="text" id="title" name="title" required placeholder="Enter a descriptive title for your project">
            </div>
            
            <div class="form-group">
                <label for="description">Project Description:</label>
                <textarea id="description" name="description" rows="6" required 
                          placeholder="Describe your project requirements, deliverables, and any specific skills needed..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="budget">Budget ($):</label>
                <input type="number" id="budget" name="budget" step="0.01" min="0" required 
                       placeholder="Enter your project budget">
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Post Project</button>
                <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
